spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.traceguard: INFO

traceguard:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:traceguard-api}
    audience: ${JWT_AUDIENCE:traceguard-admin-api}
  rate-limit:
    redis:
      enabled: ${RATE_LIMIT_REDIS_ENABLED:true}
