        amber: { 400: '#fbbf24', 500: '#f59e0b' },

<style>
/* ── Theme Variables ── */
:root {
  --bg-primary: #f8fafc;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --sidebar: #0f172a;
  --sidebar-hover: #1e293b;
  --sidebar-active: #1e293b;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
  --chart-grid: #e2e8f0;
  --severity-critical: #ef4444;
  --severity-high: #f59e0b;
  --severity-medium: #f97316;
  --severity-low: #3b82f6;
  --kpi-events: #6366f1;
  --kpi-alerts: #f59e0b;
  --kpi-users: #10b981;
  --kpi-tenants: #06b6d4;
}
[data-theme="dark"] {
  --bg-primary: #0a0f1e;
  --bg-secondary: #0f172a;
  --bg-tertiary: #172033;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: #1e293b;
  --sidebar: #060a15;
  --sidebar-hover: #0f172a;
  --sidebar-active: #0f172a;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
  --chart-grid: #1e293b;
}
/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: background 0.3s, color 0.3s; }
/* ── Transitions ── */
.theme-transition, .theme-transition * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease !important; }
.fade-enter { animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes countUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.animate-slide { animation: slideIn 0.3s ease-out; }
.animate-count { animation: countUp 0.5s ease-out; }
/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
/* ── Sidebar ── */
.sidebar { background: var(--sidebar); }
.sidebar a { color: var(--text-muted); transition: all 0.15s; }
.sidebar a:hover { background: var(--sidebar-hover); color: var(--text-primary); }
.sidebar a.active { background: var(--sidebar-active); color: #fff; }
/* ── Status badges ── */
.badge-critical { background: rgba(239,68,68,0.12); color: #ef4444; }
.badge-high { background: rgba(245,158,11,0.12); color: #f59e0b; }
.badge-medium { background: rgba(249,115,22,0.12); color: #f97316; }
.badge-low { background: rgba(59,130,246,0.12); color: #3b82f6; }
.badge-info { background: rgba(99,102,241,0.12); color: #818cf8; }
.badge-success { background: rgba(16,185,129,0.12); color: #10b981; }
.badge-error { background: rgba(239,68,68,0.12); color: #ef4444; }
.badge-warning { background: rgba(245,158,11,0.12); color: #f59e0b; }
/* ── KPI cards ── */
.kpi-card { background: var(--bg-secondary); border: 1px solid var(--border); box-shadow: var(--shadow); }
.kpi-card .kpi-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
.kpi-card .kpi-value { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
.kpi-card .kpi-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.kpi-card .kpi-delta { font-size: 0.7rem; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
/* ── Content panels ── */
.panel { background: var(--bg-secondary); border: 1px solid var(--border); box-shadow: var(--shadow); }
.panel-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.panel-header h3 { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); }
.panel-body { padding: 16px 20px; }
/* ── Table ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { text-align: left; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px; color: var(--text-muted); border-bottom: 1px solid var(--border); background: var(--bg-tertiary); }
.data-table td { padding: 10px 14px; font-size: 0.82rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--bg-tertiary); }
/* ── Inputs ── */
.input { background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 12px; border-radius: 6px; font-size: 0.82rem; outline: none; transition: border-color 0.15s; }
.input:focus { border-color: #6366f1; }
.input::placeholder { color: var(--text-muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 500; transition: all 0.15s; cursor: pointer; border: none; }
.btn-primary { background: #6366f1; color: #fff; }
.btn-primary:hover { background: #4f46e5; }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg-tertiary); }
.btn-sm { padding: 6px 10px; font-size: 0.75rem; }
/* ── Modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
.modal-box { background: var(--bg-secondary); border-radius: 12px; width: 100%; max-width: 480px; margin: 16px; box-shadow: var(--shadow-lg); animation: fadeIn 0.2s ease-out; }
.modal-box .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-box .modal-header h3 { font-size: 1rem; font-weight: 600; }
.modal-box .modal-body { padding: 20px; }
.modal-box .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
/* ── Event feed ── */
.event-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.event-item:last-child { border-bottom: none; }
.event-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
/* ── Charts ── */
.chart-container { position: relative; width: 100%; height: 200px; }
/* ── Severity bar ── */
.severity-bar { display: flex; height: 24px; border-radius: 6px; overflow: hidden; }
.severity-bar div { transition: width 0.6s ease; }
/* ── Loading ── */
.loading-shimmer { background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--border) 50%, var(--bg-tertiary) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
/* ── Responsive ── */
@media (max-width: 768px) { .sidebar { width: 56px !important; } .sidebar span, .sidebar h2, .sidebar p { display: none; } }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   TraceGuard — Security Dashboard
   SPA completamente autônomo. Conecta-se à API do backend.
   ═══════════════════════════════════════════════════════════════ */

/* ── Constants ── */
const API = '';
const TOKEN_KEY = 'tg_token';
const USER_KEY = 'tg_user';
const THEME_KEY = 'tg_theme';

/* ── State ── */
let charts = {};
let currentSection = 'dashboard';

/* ── Helpers ── */
function getToken() { return localStorage.getItem(TOKEN_KEY); }
function getUser() { try { return JSON.parse(localStorage.getItem(USER_KEY) || '{}'); } catch { return {}; } }
function isAuth() { return !!getToken(); }
function $(id) { return document.getElementById(id); }

function getTheme() { return localStorage.getItem(THEME_KEY) || 'dark'; }
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem(THEME_KEY, t);
  document.documentElement.classList.toggle('theme-transition', true);
  setTimeout(() => document.documentElement.classList.remove('theme-transition'), 400);
}

/* ── API Client ── */
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  const token = getToken();
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(`${API}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 204) return null;
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  if (!res.ok) throw new Error(data?.error?.message || data?.message || `HTTP ${res.status}`);
  return data;
}

/* ── Login ── */
async function login(email, password) {
  const res = await api('POST', '/api/v1/auth/login', { email, password });
  localStorage.setItem(TOKEN_KEY, res.data.accessToken);
  localStorage.setItem(USER_KEY, JSON.stringify(res.data.user));
  return res.data;
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
  charts = {};
  render();
}

/* ── Formatting ── */
function fmtDate(iso) { if (!iso) return '-'; try { return new Date(iso).toLocaleString('pt-BR'); } catch { return iso; } }
function fmtTime(iso) { if (!iso) return '-'; try { return new Date(iso).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }); } catch { return iso; } }
function fmtShortId(id) { return id ? id.substring(0, 8) + '…' : '-'; }
function severityBadge(s) {
  const cls = (s||'INFO').toLowerCase();
  return `<span class="px-2 py-0.5 rounded text-xs font-medium badge-${cls}">${s||'INFO'}</span>`;
}
function actionBadge(action) {
  const cls = action === 'CREATE' ? 'badge-success' : action === 'UPDATE' ? 'badge-warning' : action === 'DELETE' ? 'badge-error' : action === 'ACCESS_DENIED' ? 'badge-error' : action === 'RATE_LIMITED' ? 'badge-warning' : action === 'ERROR' ? 'badge-error' : 'badge-info';
  return `<span class="px-2 py-0.5 rounded text-xs font-medium ${cls}">${action}</span>`;
}
function statusBadge(status) {
  if (status === 'ACTIVE' || status === true) return '<span class="px-2 py-0.5 rounded text-xs font-medium badge-success">Ativo</span>';
  return '<span class="px-2 py-0.5 rounded text-xs font-medium badge-error">Inativo</span>';
}
function kpiDelta(val) {
  if (val == null) return '';
  const cls = val >= 0 ? 'badge-success' : 'badge-error';
  const icon = val >= 0 ? 'fa-arrow-up' : 'fa-arrow-down';
  return `<span class="kpi-delta ${cls}"><i class="fas ${icon} mr-0.5"></i>${Math.abs(val).toFixed(1)}%</span>`;
}

/* ── Charts ── */
function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function renderTimelineChart(canvasId, data) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const isDark = getTheme() === 'dark';
  charts[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(d => d.hour),
      datasets: [{
        label: 'Eventos',
        data: data.map(d => d.count),
        fill: true,
        backgroundColor: 'rgba(99,102,241,0.08)',
        borderColor: '#6366f1',
        borderWidth: 2,
        pointRadius: 2,
        pointHoverRadius: 5,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: isDark ? '#1e293b' : '#e2e8f0' }, ticks: { color: isDark ? '#94a3b8' : '#64748b', maxTicksLimit: 8, font: { size: 10 } } },
        y: { grid: { color: isDark ? '#1e293b' : '#e2e8f0' }, ticks: { color: isDark ? '#94a3b8' : '#64748b', font: { size: 10 }, precision: 0 }, beginAtZero: true }
      },
      interaction: { intersect: false, mode: 'index' }
    }
  });
}

function renderSeverityChart(canvasId, data) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const colors = { CRITICAL: '#ef4444', HIGH: '#f59e0b', MEDIUM: '#f97316', LOW: '#3b82f6', INFO: '#6366f1' };
  const bgColors = { CRITICAL: 'rgba(239,68,68,0.15)', HIGH: 'rgba(245,158,11,0.15)', MEDIUM: 'rgba(249,115,22,0.15)', LOW: 'rgba(59,130,246,0.15)', INFO: 'rgba(99,102,241,0.15)' };
  charts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: data.map(d => d.severity),
      datasets: [{
        data: data.map(d => d.count),
        backgroundColor: data.map(d => colors[d.severity] || '#6366f1'),
        borderWidth: 0,
        hoverOffset: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '70%',
      plugins: {
        legend: {
          position: 'right',
          labels: { color: isDark() ? '#94a3b8' : '#64748b', padding: 12, font: { size: 11 }, usePointStyle: true, pointStyleWidth: 8 }
        }
      }
    }
  });
  function isDark() { return getTheme() === 'dark'; }
}

/* ═══════════════════════════════════════════════════════════════
   VIEWS
   ═══════════════════════════════════════════════════════════════ */

/* ── Login View ── */
function LoginView() {
  return `
<div class="min-h-screen flex items-center justify-center" style="background: linear-gradient(135deg, #060a15 0%, #0f172a 50%, #1a1040 100%);">
  <div class="w-full max-w-sm mx-4 fade-enter">
    <div class="panel rounded-2xl p-8" style="background: var(--bg-secondary); border: 1px solid var(--border);">
      <div class="text-center mb-8">
        <div class="w-14 h-14 mx-auto mb-4 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, #6366f1, #4f46e5);">
          <i class="fas fa-shield-halved text-white text-xl"></i>
        </div>
        <h1 class="text-xl font-bold">TraceGuard</h1>
        <p class="text-sm" style="color: var(--text-muted);">Security Dashboard</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">Email</label>
          <input type="email" name="email" value="admin@traceguard.local" required class="input w-full">
        </div>
        <div>
          <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">Password</label>
          <input type="password" name="password" required class="input w-full">
        </div>
        <button type="submit" class="btn btn-primary w-full justify-center py-2.5">
          <i class="fas fa-right-to-bracket"></i> Sign In
        </button>
      </form>
      <p id="login-error" class="text-xs text-red-400 text-center mt-4 hidden"></p>
    </div>
  </div>
</div>`;
}

/* ── Main Layout ── */
function MainLayout() {
  const user = getUser();
  const theme = getTheme();
  return `
<div class="flex h-screen overflow-hidden">
  <aside class="sidebar w-64 shrink-0 flex flex-col" style="background: var(--sidebar);">
    <div class="px-4 py-4 flex items-center gap-3 border-b" style="border-color: var(--border);">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background: linear-gradient(135deg, #6366f1, #4f46e5);">
        <i class="fas fa-shield-halved text-white text-xs"></i>
      </div>
      <div class="min-w-0">
        <h2 class="font-semibold text-sm text-white">TraceGuard</h2>
        <p class="text-xs" style="color: var(--text-muted);">Security Ops</p>
      </div>
    </div>
    <nav class="flex-1 px-2 py-3 space-y-0.5 overflow-y-auto" id="sidebar-nav">
      ${navItem('dashboard', 'fa-chart-pie', 'Dashboard')}
      ${navItem('alerts', 'fa-bell', 'Alerts')}
      ${navItem('activity', 'fa-users-gear', 'Activity')}
      ${navItem('audit', 'fa-clipboard-list', 'Audit Trail')}
      ${navItem('blocked-ips', 'fa-ban', 'Blocked IPs')}
      ${navItem('tenants', 'fa-building', 'Tenants')}
      ${navItem('api-keys', 'fa-key', 'API Keys')}
      ${navItem('integrations', 'fa-plug', 'Integrations')}
    </nav>
    <div class="px-3 py-3 border-t" style="border-color: var(--border);">
      <div class="flex items-center gap-2 mb-2">
        <button onclick="toggleTheme()" class="btn btn-ghost btn-sm flex-1 justify-center" title="Toggle theme">
          <i class="fas ${theme === 'dark' ? 'fa-sun' : 'fa-moon'}"></i>
        </button>
        <button onclick="exportReport()" class="btn btn-ghost btn-sm flex-1 justify-center" title="Export PDF Report">
          <i class="fas fa-download"></i>
        </button>
      </div>
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold" style="background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;">
            ${(user.email||'A')[0].toUpperCase()}
          </div>
          <div class="min-w-0">
            <p class="text-xs font-medium truncate text-white">${user.email||'Admin'}</p>
            <p class="text-xs" style="color: var(--text-muted);">${user.role||''}</p>
          </div>
        </div>
        <button onclick="logout()" class="text-xs shrink-0" style="color: var(--text-muted);" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </aside>
  <main class="flex-1 overflow-y-auto" style="background: var(--bg-primary);">
    <div id="section-header" class="px-6 py-4 border-b sticky top-0 z-10" style="background: var(--bg-primary); border-color: var(--border);">
      <div class="flex items-center justify-between">
        <h1 class="text-lg font-bold" id="page-title">Dashboard</h1>
        <div class="flex items-center gap-2 text-xs" style="color: var(--text-muted);">
          <i class="fas fa-circle text-emerald-400" style="font-size: 0.5rem;"></i> System Online
        </div>
      </div>
    </div>
    <div id="main-content" class="p-6 fade-enter">
      <div class="flex items-center justify-center py-20" style="color: var(--text-muted);">
        <i class="fas fa-spinner fa-spin text-xl mr-3"></i> Loading...
      </div>
    </div>
  </main>
</div>`;
}

function navItem(section, icon, label) {
  const active = currentSection === section ? 'active' : '';
  return `<a href="#${section}" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm ${active}" data-section="${section}">
    <i class="fas ${icon} w-5 text-center" style="font-size: 0.85rem;"></i> <span>${label}</span>
  </a>`;
}

/* ═══════════════════════════════════════════════════════════════
   SECTIONS
   ═══════════════════════════════════════════════════════════════ */

async function DashboardSection() {
  try {
    const [kpiRes, severityRes, timelineRes, eventsRes, criticalRes] = await Promise.all([
      api('GET', '/api/v1/admin/dashboard/kpi').catch(() => ({ data: {} })),
      api('GET', '/api/v1/admin/dashboard/severity-distribution').catch(() => ({ data: [] })),
      api('GET', '/api/v1/admin/dashboard/timeline').catch(() => ({ data: [] })),
      api('GET', '/api/v1/admin/dashboard/recent-events').catch(() => ({ data: [] })),
      api('GET', '/api/v1/admin/dashboard/critical-alerts').catch(() => ({ data: [] }))
    ]);
    const kpi = kpiRes.data || {};
    const severity = severityRes.data || [];
    const timeline = timelineRes.data || [];
    const events = eventsRes.data || [];
    const critical = criticalRes.data || [];
    const totalAlerts = severity.reduce((s, i) => s + i.count, 0);

    setTimeout(() => {
      if (timeline.length) renderTimelineChart('chart-timeline', timeline);
      if (severity.length) renderSeverityChart('chart-severity', severity);
    }, 50);

    return `
<div class="space-y-6 fade-enter" data-section-init="dashboard">
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    ${kpiCard('fa-chart-bar', 'kpi-events', kpi.totalEvents24h ?? '—', 'Events (24h)', kpi.eventsChangePercent)}
    ${kpiCard('fa-bell', 'kpi-alerts', kpi.activeAlerts ?? '—', 'Active Alerts', kpi.alertsChangePercent)}

function kpiCard(icon, color, value, label, delta) {
  const colors = { 'kpi-events': '#6366f1', 'kpi-alerts': '#f59e0b', 'kpi-users': '#10b981', 'kpi-tenants': '#06b6d4' };
  const bgColors = { 'kpi-events': 'rgba(99,102,241,0.1)', 'kpi-alerts': 'rgba(245,158,11,0.1)', 'kpi-users': 'rgba(16,185,129,0.1)', 'kpi-tenants': 'rgba(6,182,212,0.1)' };
  const c = colors[color] || '#6366f1';
  const bg = bgColors[color] || 'rgba(99,102,241,0.1)';
  return `
<div class="kpi-card rounded-xl p-4">
  <div class="flex items-center gap-3">
    <div class="kpi-icon" style="background: ${bg}; color: ${c};"><i class="fas ${icon}"></i></div>
    <div>
      <div class="kpi-value animate-count">${value}</div>
      <div class="kpi-label">${label}</div>
      ${delta != null ? `<div class="mt-1">${kpiDelta(delta)}</div>` : ''}
    </div>
  </div>
</div>`;
}

<div class="space-y-4 fade-enter">

function alertRow(a) {
  return `<tr>
    <td>${severityBadge(a.severity)}</td>
    <td><span class="text-xs font-mono" style="color: var(--text-secondary);">${a.ruleName||'-'}</span></td>

    <td>${a.acknowledged ? '<span class="badge-success px-2 py-0.5 rounded text-xs font-medium">Acknowledged</span>' : '<span class="badge-warning px-2 py-0.5 rounded text-xs font-medium">Open</span>'}</td>
    <td><span class="text-xs" style="color: var(--text-muted);">${fmtDate(a.createdAt)}</span></td>
    <td>${!a.acknowledged ? `<button onclick="acknowledgeAlert('${a.id}')" class="btn btn-ghost btn-sm text-xs"><i class="fas fa-check"></i></button>` : ''}</td>
  </tr>`;
}

}

/* ── Export Report (PDF) ── */
async function exportReport() {
  try {
    const [kpiRes, severityRes, timelineRes] = await Promise.all([
      api('GET', '/api/v1/admin/dashboard/kpi').catch(() => ({ data: {} })),
      api('GET', '/api/v1/admin/dashboard/severity-distribution').catch(() => ({ data: [] })),
      api('GET', '/api/v1/admin/dashboard/timeline').catch(() => ({ data: [] }))
    ]);
    const kpi = kpiRes.data || {};
    const severity = severityRes.data || [];
    const timeline = timelineRes.data || [];

    // Build CSV report
    let csv = 'TraceGuard Security Report\nGenerated: ' + new Date().toISOString() + '\n\n';
    csv += '=== KPIs ===\n';
    csv += 'Events (24h),Active Alerts,Active Users,Tenants\n';
    csv += `${kpi.totalEvents24h ?? 'N/A'},${kpi.activeAlerts ?? 'N/A'},${kpi.activeUsers ?? 'N/A'},${kpi.totalTenants ?? 'N/A'}\n\n`;
    csv += '=== Severity Distribution ===\n';
    csv += 'Severity,Count,Percentage\n';
    severity.forEach(s => { csv += `${s.severity},${s.count},${s.percentage}%\n`; });
    csv += '\n=== Timeline (24h) ===\n';
    csv += 'Hour,Count\n';
    timeline.forEach(t => { csv += `${t.hour},${t.count}\n`; });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `traceguard-report-${new Date().toISOString().substring(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('Export failed: ' + e.message);
  }
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════════════════════ */

async function navigate(section) {
  currentSection = section || 'dashboard';
  // Update sidebar
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  const link = document.querySelector(`[data-section="${currentSection}"]`);
  if (link) link.classList.add('active');

  // Update title
  const titles = { dashboard: 'Dashboard', alerts: 'Detection Alerts', activity: 'User Activity', audit: 'Admin Audit Trail', 'blocked-ips': 'Blocked IPs', tenants: 'Tenants', 'api-keys': 'API Keys', integrations: 'Integrations' };
  const titleEl = document.getElementById('page-title');
  if (titleEl) titleEl.textContent = titles[currentSection] || 'Dashboard';

  // Destroy charts before loading new section
  Object.keys(charts).forEach(k => destroyChart(k));

  // Load content
  const content = document.getElementById('main-content');
  if (!content) return;
  content.innerHTML = '<div class="flex items-center justify-center py-20" style="color: var(--text-muted);"><i class="fas fa-spinner fa-spin text-xl mr-3"></i> Loading...</div>';

  const sections = {
    dashboard: DashboardSection,
    alerts: AlertsSection,
    activity: ActivitySection,
    audit: AuditSection,
    'blocked-ips': BlockedIpsSection,
    tenants: TenantsSection,
    'api-keys': ApiKeysSection,
    integrations: IntegrationsSection
  };
  const loader = sections[currentSection] || DashboardSection;
  try {
    content.innerHTML = await loader();
  } catch(e) {
    content.innerHTML = `<div class="p-6 text-red-400"><i class="fas fa-exclamation-triangle mr-2"></i> ${e.message}</div>`;
  }
}

window.addEventListener('hashchange', () => {
  const section = location.hash.replace('#', '') || 'dashboard';
  navigate(section);
});

function toggleTheme() {
  const current = getTheme();
  setTheme(current === 'dark' ? 'light' : 'dark');
  // Re-render charts
  if (currentSection === 'dashboard') navigate('dashboard');
}

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */

function render() {
  setTheme(getTheme());
  const app = document.getElementById('app');
  if (!isAuth()) {
    app.innerHTML = LoginView();
    const form = document.getElementById('login-form');
    if (form) form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const errEl = document.getElementById('login-error');
      try {
        await login(fd.get('email'), fd.get('password'));
        render();
      } catch (err) {
        if (errEl) { errEl.textContent = err.message; errEl.classList.remove('hidden'); }
      }
    };
  } else {
    app.innerHTML = MainLayout();
    navigate(location.hash.replace('#', '') || 'dashboard');
  }
}

render();
</script>
