server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: traceguard-api
  profiles:
    default: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  data:
    redis:
      timeout: ${REDIS_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    syntax-highlight:
      theme: monokai
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    com.traceguard: INFO

traceguard:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-at-least-32-characters}
    issuer: ${JWT_ISSUER:traceguard-api}
    audience: ${JWT_AUDIENCE:traceguard-admin-api}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:5}
    refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:10}
    audit-ingest-per-minute: ${RATE_LIMIT_AUDIT_INGEST_PER_MINUTE:120}
    audit-query-per-minute: ${RATE_LIMIT_AUDIT_QUERY_PER_MINUTE:60}
    admin-read-per-minute: ${RATE_LIMIT_ADMIN_READ_PER_MINUTE:120}
    admin-write-per-minute: ${RATE_LIMIT_ADMIN_WRITE_PER_MINUTE:30}
    redis:
      enabled: ${RATE_LIMIT_REDIS_ENABLED:false}